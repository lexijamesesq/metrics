# Metrics' ruff config. Deliberately narrow: the traditional correctness floor
# (syntax errors, undefined names, unused imports/variables) — E4/E7/E9/F —
# pinned explicitly rather than left to ruff's ambient default, which on this
# ruff version pulls in a much broader set (security, complexity, style,
# import-sorting rule families) and surfaces 106 pre-existing findings across
# the tree. Same shape as hazel's pyproject.toml for the identical reason.
# Widening this select is a deliberate, separate decision for a
# future cleanup pass, not something this relocation folds in silently.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
