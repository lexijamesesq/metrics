name: CI
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floor:
    # Read scopes the floor uses with github.token (Jev's triage answer on the
    # head's check-runs). A called workflow gets no more than this; on a
    # private repo the triage read 403s without it and the PR runs the full
    # suite. No write scope, no secret: this is the lane a PR controls.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: lexijamesesq/dotty/.github/workflows/estate-ci.yml@v1
    with:
      dotty_ref: v1

  all-checks-passed:
    needs: [floor, ruff, shellcheck, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded (a job skipped on a mechanical PR is satisfied)
        env:
          RESULTS: ${{ toJSON(needs) }}
          MECHANICAL: ${{ needs.floor.outputs.mechanical }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A skipped job is satisfied on a mechanical PR (the floor skipped
          # it) and on any non-PR event (a push to the default branch, where
          # any job skipped by its own `if:` is not a PR's failure); on a
          # functional PR a skipped job is a failure.
          bad="$(jq -r --arg mech "$MECHANICAL" --arg event "$EVENT" '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled"
                     or (.value.result == "skipped" and $mech != "true" and $event == "pull_request"))
            | .key' <<<"$RESULTS")"
          if [[ -n "$bad" ]]; then
            echo "required job(s) not satisfied: $bad"
            exit 1
          fi
          echo "all checks passed (event=${EVENT} mechanical=${MECHANICAL:-false})"

  ruff:
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv 0.11.22
        run: pip install uv==0.11.22
      - name: ruff
        run: uvx ruff@0.16.5 check --force-exclude .

  shellcheck:
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'
          ignore_paths: .git

  gitleaks:
    needs: [floor]
    if: ${{ needs.floor.outputs.mechanical != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A composite action (not gitleaks/gitleaks-action) — same reasoning as
      # dotty's .github/README.md: explicit control over scan range and
      # gitleaks:allow handling, not the vendor action's undocumented
      # defaults. Pinned to dotty's merge SHA, only reachable once it's on
      # dotty main.
      - name: Setup gitleaks
        uses: lexijamesesq/dotty/.github/actions/setup-gitleaks@v1
        with:
          version: '8.30.1'
      - name: gitleaks scan (base rules only, PR range, redacted)
        env:
          # Base rules only: a CI runner has no dotty-private checkout, so
          # .gitleaks.toml's [extend] (the operator's private PII ruleset,
          # loaded through a gitignored symlink) can't resolve here — see
          # .gitleaks-ci.toml's own header. Public repo: the operator's PII
          # rules never reach CI either way; --redact keeps any real
          # finding's matched text out of the log regardless.
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Fail-closed range validation, mirroring dotty's
          # gitleaks-pre-push.sh: `gitleaks git --log-opts="<range>"` is
          # documented (gitleaks 8.30.1) to FAIL OPEN on an unresolvable
          # range — it logs a git fatal error, reports "0 commits scanned" /
          # "no leaks found", and exits 0. A pull_request event's base/head
          # SHAs are always real commits, but we still verify the range
          # resolves and treat scanner stderr carrying `fatal:` as an
          # untrustworthy exit code, never a pass.
          if ! count="$(git rev-list --count "$RANGE")"; then
            echo "::error::commit range '$RANGE' did not resolve — refusing to trust an unscanned range"
            exit 1
          fi
          echo "Scanning $count commit(s) in range $RANGE"
          errf="$(mktemp)"
          gitleaks git . \
            --log-opts="$RANGE" \
            --config=.gitleaks-ci.toml \
            --no-banner --redact --ignore-gitleaks-allow \
            2>"$errf"
          rc=$?
          cat "$errf" >&2
          if grep -qE 'fatal:|stderr is not empty' "$errf"; then
            echo "::error::gitleaks reported a git error scanning the range — its exit code is untrustworthy here, failing closed"
            exit 1
          fi
          exit "$rc"
